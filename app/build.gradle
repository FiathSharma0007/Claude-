plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fiath.videohub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fiath.videohub'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '2.1'
    }

    // Fixed key so every build can be installed over the previous one
    // (a new key per build would force uninstalling and losing data).
    signingConfigs {
        fixed {
            storeFile file('videohub.keystore')
            storePassword 'videohub123'
            keyAlias 'videohub'
            keyPassword 'videohub123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
