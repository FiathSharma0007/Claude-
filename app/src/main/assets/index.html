<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Faith Finance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">&#8592;</button>
    <h1 id="pageTitle">Faith Finance</h1>
    <button id="newBtn" class="primary small">+ New Video</button>
  </header>

  <main id="view"></main>

  <nav class="bottomnav" id="nav">
    <button data-tab="library" class="active"><span class="nav-ico">&#127968;</span>Library</button>
    <button data-tab="checklist" class="nav-check"><span class="nav-ico check-ico">&#9745;</span>Checklist</button>
    <button data-tab="youtube"><span class="dot youtube"></span>YouTube</button>
    <button data-tab="instagram"><span class="dot instagram"></span>Instagram</button>
    <button data-tab="facebook"><span class="dot facebook"></span>Facebook</button>
    <button data-tab="tiktok"><span class="dot tiktok"></span>TikTok</button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <h2>New video</h2>
      <p class="hint">Created once in the library. It is added to the Checklist and to YouTube, Instagram, Facebook and TikTok automatically.</p>
      <div id="draftMedia"></div>
      <label>Video title<input id="newTitle" maxlength="200" placeholder="e.g. Morning routine vlog"></label>
      <label>Notes / description<textarea id="newDesc" rows="3" placeholder="Main description (copied to each platform)"></textarea></label>
      <label>Hashtags<input id="newTags" placeholder="#vlog #daily"></label>
      <div class="row end">
        <button id="cancelNew" class="ghost">Cancel</button>
        <button id="createNew" class="primary">Create</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
