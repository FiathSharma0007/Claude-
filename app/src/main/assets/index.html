<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Faith Finance</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">&#8592;</button>
    <img class="brand" src="logo.png" alt="Faith Finance logo">
    <h1 id="pageTitle">Faith Finance</h1>
    <button id="accountsBtn" class="icon-btn acct" aria-label="Connected accounts" title="Connected accounts">&#128279;</button>
    <button id="newBtn" class="primary small">+ New Video</button>
  </header>

  <main id="view"></main>

  <nav class="bottomnav" id="nav">
    <button data-tab="library" class="active"><span class="nav-ico">&#127968;</span>Library</button>
    <button data-tab="checklist" class="nav-check"><span class="nav-ico check-ico">&#9745;</span>Checklist</button>
    <button data-tab="youtube"><span class="dot youtube"></span>YouTube</button>
    <button data-tab="instagram"><span class="dot instagram"></span>Instagram</button>
    <button data-tab="facebook"><span class="dot facebook"></span>Facebook</button>
    <button data-tab="tiktok"><span class="dot tiktok"></span>TikTok</button>
  </nav>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <h2 id="newHeading">New video</h2>
      <p class="hint">This video stays only in the platform you choose. It also appears in the Checklist automatically.</p>
      <div class="plat-label">Platform</div>
      <div id="platformPick" class="platform-pick"></div>
      <div id="draftMedia"></div>
      <label id="newTitleLabel">Title<input id="newTitle" maxlength="300" placeholder="Video title"></label>
      <label>Description<textarea id="newDesc" rows="3" placeholder="Description"></textarea></label>
      <label>Hashtags<input id="newTags" placeholder="#finance #money"></label>
      <div class="row end">
        <button id="cancelNew" class="ghost">Cancel</button>
        <button id="createNew" class="primary">Create</button>
      </div>
    </div>
  </div>

  <div id="formModal" class="modal hidden">
    <div class="sheet" id="formSheet"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
