name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk FaithFinance.apk
          cp FaithFinance.apk VideoHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FaithFinance-apk
          path: FaithFinance.apk

      # Publishes the APK as a direct download link:
      # https://github.com/<owner>/<repo>/releases/latest/download/FaithFinance.apk
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Faith Finance (latest build)
          body: |
            Latest Faith Finance APK, built from commit ${{ github.sha }}.
            Download FaithFinance.apk below and install it on your Android phone.
          files: |
            FaithFinance.apk
            VideoHub.apk
          make_latest: true
